services:
  ifood-migrator:
    build:
      context: .
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    env_file:
      - .env
    environment:
      # No container o bind deve ser 0.0.0.0 (no .env local costuma ser localhost)
      HOST: 0.0.0.0
      PORT: ${PORT:-3005}
      DATABASE_PATH: /app/data/scraper.db
      SCRAPER_STRATEGY: ${SCRAPER_STRATEGY:-auto}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      SCRAPE_TIMEOUT_S: ${SCRAPE_TIMEOUT_S:-60}
      MAX_ITEMS_DETAIL: ${MAX_ITEMS_DETAIL:-40}
      SCRAPER_DEBUG: ${SCRAPER_DEBUG:-true}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 1.5g
    shm_size: "256mb"
    security_opt:
      - no-new-privileges:true
